availability: Open to internships, full-time roles, and research collaborations

bio: |
  Almost everything with a plug or a battery — phones, cars, pacemakers, power grids, aircraft —
  runs on semiconductor chips. Those chips are designed, manufactured, packaged, and tested by
  dozens of separate companies spread across the world, and no single company ever sees the whole
  process. That fragmentation creates openings: a design can be stolen and cloned, quietly altered
  so that it misbehaves years later, or built in a way that unintentionally leaks the very secrets
  it was meant to protect. Closing those openings is the problem I work on.

  My research asks how far artificial intelligence can help. I build systems that read a chip's
  blueprint the way an experienced security reviewer would, single out the parts most likely to be
  exploited, and then repair them automatically. Just as importantly, these systems explain
  themselves: an engineer can see why a particular circuit was flagged instead of being asked to
  trust a score. That explainability is what turns a prediction into something a design team can
  act on, and it ties together my work on choosing the right security defenses (X-DFS), catching
  maliciously inserted circuits (SALTY), and stopping chips from leaking secrets through their
  power consumption (POLARIS).

  I work on the mirror image of that question too — the security of AI itself. As AI moves out of
  demonstrations and into infrastructure, it becomes something worth attacking. I study how models
  can be fooled by inputs deliberately crafted to deceive them (DASH), and how groups of AI agents
  working together can amplify one another's harmful behavior in ways no single model would (HARP).
  More recently I have been building agents that plan and carry out an entire hardware security
  review on their own (LOGIC).

  This work appears in IEEE Transactions on Information Forensics and Security, CVPR, the Design
  Automation Conference, and IEEE Communications Surveys & Tutorials, and has led to two
  provisional patents filed with the University of Florida and IN2FAB Technology. I am a Ph.D.
  candidate at the University of Maine, where I research at the SIEGE Lab under Dr. Prabuddha
  Chakraborty. Before graduate school I was a software engineer at Robi Axiata Limited in Dhaka,
  Bangladesh.

