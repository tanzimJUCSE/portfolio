seoDescription: >-
  Tanzim Mahfuz is a Ph.D. candidate in Electrical and Computer Engineering at the University of
  Maine. He uses explainable and agentic AI to secure the semiconductor supply chain — hardware
  Trojan detection, side-channel mitigation, and design-for-security — and researches the security
  of AI systems themselves.

