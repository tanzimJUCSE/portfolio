bio: |
  I am a Ph.D. candidate in Electrical and Computer Engineering at the University of Maine, where I
  research at the SIEGE Lab under Dr. Prabuddha Chakraborty. My work centers on one question: can
  artificial intelligence explain, and then improve, the security of the hardware everything else
  runs on?

  I build explainable and agentic AI systems that find, quantify, and repair vulnerabilities in
  digital designs — from design-for-security solution space exploration (X-DFS) and hardware Trojan
  detection (SALTY) to power side-channel leakage mitigation (POLARIS) and LLM-orchestrated
  frameworks for secure hardware design optimization.

  This research has appeared in IEEE Transactions on Information Forensics and Security, CVPR, the
  Design Automation Conference, and IEEE Communications Surveys & Tutorials, and has led to two
  provisional patents filed jointly with the University of Florida and IN2FAB Technology. Before
  graduate school I worked as a software engineer at Robi Axiata Limited in Dhaka, Bangladesh.

