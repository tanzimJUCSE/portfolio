# Everything here is yours to rewrite. Upload photos in the Media section, then add them below.
- title: Traveling
  emoji: "🧭"
  body: |
    Traveling is how I reset. Remote areas, waterfalls, and long stretches of seashore have a way of
    resetting my sense of scale, and being somewhere unfamiliar teaches patience better than any
    deadline does.

    Since moving to Maine I have been slowly working through New England, and I still measure every
    new coastline against the ones back home in Bangladesh.
  images: []

- title: Photography
  emoji: "📷"
  body: |
    I photograph most of the places I visit. I am drawn to landscapes and to the small, ordinary
    moments in a place that a postcard would never bother with.
  images: []

- title: Culture & community
  emoji: "🎭"
  body: |
    I served as President of the Bangladesh Students' Association at the University of Maine, where
    our team won Best Cultural Presentation at the UMaine Cultural Fest. Introducing people to
    Bangladeshi food, music, and language, and learning other cultures in return, has been one of
    the most rewarding parts of graduate school.
  images: []
